name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Godot files
        uses: actions/cache@v3
        with:
          path: |
            ~/.local/share/godot
            ~/.config/godot
          key: godot-cache-${{ hashFiles('project.godot') }}

      - name: Download and config Godot Engine Linux server and templates
        run: |
          # استخدام الإصدار الرسمي المطابق تماماً لرسالة الخطأ لديك
          VERSION_TAG="4.7.1.stable"
          
          wget https://github.com/godotengine/godot/releases/download/${VERSION_TAG}/Godot_v${VERSION_TAG}_linux.x86_64.zip
          wget https://github.com/godotengine/godot/releases/download/${VERSION_TAG}/Godot_v${VERSION_TAG}_export_templates.tpz
          
          unzip Godot_v${VERSION_TAG}_linux.x86_64.zip
          mv Godot_v${VERSION_TAG}_linux.x86_64 /usr/local/bin/godot
          
          # إنشاء المسار الصحيح تماماً ونقل القوالب إليه دون أخطاء
          mkdir -p ~/.local/share/godot/export_templates/${VERSION_TAG}
          unzip Godot_v${VERSION_TAG}_export_templates.tpz
          
          # التعامل مع المجلد الناتج لفك الضغط ونقل محتوياته للمسار الصحيح
          mv -f export_templates/* ~/.local/share/godot/export_templates/${VERSION_TAG}/ || mv -f templates/* ~/.local/share/godot/export_templates/${VERSION_TAG}/ || true
          
          rm -f Godot_v${VERSION_TAG}_linux.x86_64.zip Godot_v${VERSION_TAG}_export_templates.tpz

      - name: Open project once to import assets and templates
        run: |
          timeout 120 godot --headless --path . --editor --quit || true

      - name: Create export directory
        run: mkdir -p build/android

      - name: Export Android APK
        run: |
          godot --headless --path . --export-release "Android" build/android/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/app-release.apk
