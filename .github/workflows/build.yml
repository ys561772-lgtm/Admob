name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Godot files
        uses: actions/cache@v3
        with:
          path: |
            ~/.local/share/godot
            ~/.config/godot
          key: godot-cache-${{ hashFiles('project.godot') }}

      - name: Download and config Godot Engine Linux server and templates
        run: |
          GODOT_VERSION=4.7.1-stable
          DOWNLOAD_NAME=Godot_v${GODOT_VERSION}_linux.x86_64
          TEMPLATES_NAME=Godot_v${GODOT_VERSION}_export_templates.tpz
          
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${DOWNLOAD_NAME}.zip
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${TEMPLATES_NAME}
          
          unzip ${DOWNLOAD_NAME}.zip
          mv ${DOWNLOAD_NAME} /usr/local/bin/godot
          
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}
          unzip ${TEMPLATES_NAME}
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}/
          rm -f ${DOWNLOAD_NAME}.zip ${TEMPLATES_NAME}

      - name: Open project once to import assets and templates
        run: |
          timeout 120 godot --headless --path . --editor --quit || true

      - name: Create export directory
        run: mkdir -p build/android

      - name: Export Android APK
        run: |
          godot --headless --path . --export-release "Android" build/android/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/app-release.apk
