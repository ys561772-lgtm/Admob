name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Godot Android APK
        uses: dulvui/godot-android-export@v4
        with:
          godot-version: 4.7.1
          godot-channel: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetroDash-Android-APK
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30
